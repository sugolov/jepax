# I-JEPA ImageNet profiling config

exp_name: jepa_imagenet_profile
save_dir: ./checkpoints
save_interval: 100
shard: true
bfloat16: false

data:
  dataset: imagenet
  data_dir: ~/data
  batch_size: 512
  num_workers: 8
  prefetch_factor: 4

model:
  name: ijepa-b
  patch_size: 14
  seq_len: 256
  num_channels: 3
  p_drop: 0.0

train:
  epochs: 300
  lr: 1.5e-4
  start_lr: 2.0e-4
  final_lr: 1.0e-6
  warmup_epochs: 40
  wd: 0.05
  final_wd: null
  ema_decay: 0.996
  seed: 42

mask:
  n_pred_masks: 4
  num_pad: 64
  pred_scale: [0.15, 0.2]
  pred_aspect: [0.75, 1.5]
  ctx_scale: [0.85, 1.0]
  ctx_aspect: 1.0

eval:
  interval: 10
  epochs: 20
  batch_size: 4096
  train_samples: null
  val_samples: null
  n_concat: 4
  optim: adam
  lr: 1.0e-2
  wd: 5.0e-4

logging:
  use_wandb: true
  wandb_project: ijepa
  use_aim: false
  aim_repo: .aim
  tag: null

profile:
  enabled: true
  start_step: 5
  end_step: 10
  log_dir: ./logs/profile
