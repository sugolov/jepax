exp_name: jepa_imagenet_huge
save_dir: ./checkpoints
save_interval: 50
shard: true
bfloat16: false # investigate

data:
  dataset: imagenet
  data_dir: /mnt/data0/shared/owen/imagenet
  batch_size: 2048
  num_workers: 16
  prefetch_factor: 4

model:
  name: ijepa-h
  patch_size: 14
  seq_len: 256
  num_channels: 3
  p_drop: 0.0

train:
  epochs: 300
  lr: 1.0e-3
  start_lr: 2.0e-4
  final_lr: 1.0e-6
  warmup_epochs: 40
  wd: 0.04
  final_wd: 0.4
  ema_start: 0.996
  ema_end: 1.0
  seed: 42
  normalize_targets: true

mask:
  n_pred_masks: 4
  pred_scale: [0.15, 0.2]
  pred_aspect: [0.75, 1.5]
  ctx_scale: [0.85, 1.0]
  ctx_aspect: 1.0

eval:
  bn_mode: ema
  interval: 30
  epochs: 50
  batch_size: 16384
  train_samples: null
  val_samples: null
  n_concat: 4
  optim: lars
  lr: 0.05
  wd: 0.0

logging:
  use_wandb: true
  wandb_entity: diogenesdude-independent
  wandb_project: ijepa
  tag: null

profile:
  enabled: false
  start_step: 10
  end_step: 60
  log_dir: .logs
