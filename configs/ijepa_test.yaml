# I-JEPA CIFAR-10 test config
data:
  dataset: cifar10
  batch_size: 32
  num_workers: 0
  prefetch_factor: 4
model:
  name: ijepa-test
  patch_size: 2
  seq_len: 256
  num_channels: 3
  p_drop: 0.0
train:
  epochs: 100
  lr: 1.5e-4
  start_lr: 1.0e-5
  final_lr: 1.0e-6
  warmup_epochs: 40
  wd: 0.05
  final_wd: 0.4
  ema_start: 0.996
  ema_end: 1.0
  seed: 0
  normalize_targets: true
mask:
  n_pred_masks: 4
  pred_scale: [0.15, 0.2]
  pred_aspect: [0.75, 1.5]
  ctx_scale: [0.85, 1.0]
  ctx_aspect: 1.0
eval:
  bn_mode: ema
  interval: 10
  epochs: 20
  batch_size: 4096
  train_samples: null
  val_samples: null
  n_concat: 4
  optim: adam
  lr: 1.0e-2
  wd: 5.0e-4