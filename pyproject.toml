[project]
name = "jepax"
version = "0.1.1"
description = "Joint-Embedding Predictive Architectures (JEPAs) in JAX"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Anton Sugolov", email = "asugolov@gmail.com"},
  {name = "Owen Lockwood", email = "contact_owenl@protonmail.com"}
]
keywords = ["jax", "machine-learning", "self-supervised-learning", "jepa"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
]
urls = { repository = "https://github.com/sugolov/jepax" }
license = {file = "LICENSE"}

dependencies = [
    "dacite>=1.8.0",
    "dm-pix>=0.4.3",
    "einops>=0.8.1",
    "equinox>=0.13.2",
    "grain>=0.2.0",
    "jax>=0.6.0",
    "numpy>=1.26.0",
    "optax>=0.2.6",
    "pyyaml>=6.0",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
]

[project.optional-dependencies]
experiments = [
    "datasets>=3.0.0",
    "huggingface_hub>=0.25.0",
    "matplotlib>=3.10.7",
    "pytest>=9.0.1",
    "tqdm>=4.67.1",
    "wandb>=0.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jepax"]

[tool.isort]
profile = "black"
combine_as_imports = true
lines_after_imports = -1
extra_standard_library = ["typing_extensions"]
order_by_type = false

[tool.black]
target-version = ["py312"]

[tool.pyright]
include = ["jepax"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
]
